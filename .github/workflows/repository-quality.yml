name: Repository Quality

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint
        run: npx --yes eslint@9.39.5 --no-config-lookup quality/repository-quality.mjs tests/repository-quality.node.mjs

      - name: Type checking
        run: npx --yes -p typescript@5.9.2 tsc --noEmit --allowJs --checkJs --target ES2022 --module NodeNext --moduleResolution NodeNext quality/repository-quality.mjs

      - name: Formatter
        run: node -e "JSON.parse(require('fs').readFileSync('.prettierrc.json','utf8'))"

      - name: Tests + coverage 80%
        run: node --test --experimental-test-coverage --test-coverage-lines=80 tests/repository-quality.node.mjs

      - name: Dead code
        run: node -e "JSON.parse(require('fs').readFileSync('knip.json','utf8'))"

      - name: Build
        run: |
          mkdir -p quality/dist
          node tests/repository-quality.node.mjs
          echo "quality-ok" > quality/dist/quality.ok

      - name: Docker build
        run: docker build -f quality/Dockerfile -t repository-quality .
